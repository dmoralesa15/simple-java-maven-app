name: CI - Maven y SonarCloud

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sonar:
    name: Build, Tests y SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar Java y Maven
        run: |
          java -version
          mvn -version

      - name: Compilar, ejecutar pruebas y analizar con SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B clean verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=dmoralesa15_simple-java-maven-app
          -Dsonar.organization=dmoralesa15
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true
